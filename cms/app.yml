# Mirrors app/app.vue: global settings used by the layout shell.

singletons:
  - name: site
    label: Site settings
    icon: settings
    file: content/settings/site.json
    format: json
    editor: { preview: false }
    fields:
      - { name: title, label: Site name, widget: string, hint: 'Shown in the header, footer and page titles.' }
      - name: logo
        label: Logo
        widget: image
        required: false
        accept: 'image/svg+xml,image/png,image/webp'
        hint: 'Replaces the site name in the header. SVG works best.'
      - name: favicon
        label: Favicon
        widget: image
        required: false
        accept: 'image/svg+xml,image/png,image/x-icon,image/vnd.microsoft.icon'
        hint: 'Browser tab icon. A square SVG, or a PNG of at least 512 × 512 px.'

  - name: seo
    label: SEO
    icon: travel_explore
    file: content/settings/seo.json
    format: json
    editor: { preview: false }
    fields:
      - name: titleSeparator
        label: Title separator
        widget: string
        default: '·'
        hint: 'Page titles render as "Page title · Site name".'
      - name: description
        label: Default meta description
        widget: text
        required: false
        hint: 'Used when a page or post has no description of its own. Aim for 150–160 characters.'
      - name: image
        label: Default social image
        widget: image
        required: false
        hint: 'Used for link previews when a page has no image. 1200 × 630 px works best.'
      - name: twitterHandle
        label: X / Twitter handle
        widget: string
        required: false
        hint: 'Including the @, e.g. @yourstudio'
      - name: noindex
        label: Hide site from search engines
        widget: boolean
        default: false
        hint: 'Adds noindex, nofollow to every page. Useful while a site is in development.'
