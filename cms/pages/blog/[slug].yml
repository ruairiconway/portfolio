# Mirrors app/pages/blog/[slug].vue: blog posts.
# (app/pages/blog/index.vue lists posts and has no CMS fields of its own.)

collections:
  - name: posts
    label: Blog posts
    label_singular: Blog post
    folder: content/posts
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    summary: '{{title}} — {{date}}'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text, required: false, hint: 'Shown in the blog listing. Also the meta description unless the SEO section sets one.' }
      - { name: date, label: Date, widget: datetime, format: 'YYYY-MM-DD', time_format: false }
      - { name: image, label: Cover image, widget: image, required: false }
      - { name: imageAlt, label: Cover image description, widget: string, required: false, hint: 'Describe the image for screen readers and search engines. Leave empty if it’s purely decorative.' }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - { name: body, label: Page content, widget: markdown }
      - '@fields/seo' # cms/fields/seo.yml
